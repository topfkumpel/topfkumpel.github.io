@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1510;--surface:#18211A;--ink:#E6EEE5;--muted:#A3B0A4;--faint:#748276;--line:#2A362C;
  --leaf:#8BCB9E;--on-leaf:#0D1E13;--leaf-soft:#1C2E22;--water:#7AB6F2;--on-water:#08182A;--water-soft:#14273C;
  --sun:#F0BC5E;--sun-soft:#33270E;--flame:#FF9C4E;--flame-soft:#3A2412;--alert:#FF8F81;--alert-soft:#3B1D19;
  --frost:#A9BCD4;--frost-soft:#1D2531;--clay:#B07E56;--clay-2:#946540;--soil:#5E4636;--xp:#F2B33D;
  --hero:#1F3B29;--hero-ink:#E8F3E8;--hero-soft:rgba(255,255,255,.08);--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1510;--surface:#18211A;--ink:#E6EEE5;--muted:#A3B0A4;--faint:#748276;--line:#2A362C;
  --leaf:#8BCB9E;--on-leaf:#0D1E13;--leaf-soft:#1C2E22;--water:#7AB6F2;--on-water:#08182A;--water-soft:#14273C;
  --sun:#F0BC5E;--sun-soft:#33270E;--flame:#FF9C4E;--flame-soft:#3A2412;--alert:#FF8F81;--alert-soft:#3B1D19;
  --frost:#A9BCD4;--frost-soft:#1D2531;--clay:#B07E56;--clay-2:#946540;--soil:#5E4636;--xp:#F2B33D;
  --hero:#1F3B29;--hero-ink:#E8F3E8;--hero-soft:rgba(255,255,255,.08);--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(108px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.08;font-weight:900}
h2{font-size:1.2rem;line-height:1.2;font-weight:800}
h3{margin:4px 4px -8px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:10px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.date{font-size:.88rem;color:var(--muted);font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:16px}
/* Maskottchen */
.hero-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center;background:var(--hero);color:var(--hero-ink);border:0;border-radius:24px;padding:14px 16px 16px;text-align:left;width:100%}
.hero-r{display:flex;flex-direction:column;gap:8px;min-width:0}
.bubble{position:relative;background:var(--hero-soft);border-radius:16px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.3}
.bubble::before{content:"";position:absolute;left:-7px;top:18px;border:7px solid transparent;border-right-color:var(--hero-soft);border-left:0}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip-flame{display:inline-flex;align-items:center;gap:5px;background:var(--flame-soft);color:var(--flame);border-radius:999px;padding:4px 10px 4px 7px;font-weight:900;font-size:.9rem}
.chip-flame.off{background:var(--hero-soft);color:var(--hero-ink);opacity:.75}
.chip-flame.off svg{filter:grayscale(1)}
.chip-lvl{font-weight:800;font-size:.85rem;opacity:.9}
.xpbar{display:block;height:9px;border-radius:99px;background:var(--hero-soft);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:var(--xp);transition:width .6s ease}
.xptxt{font-size:.75rem;font-weight:700;opacity:.8}
/* Töpfe */
.pot{display:block;flex:none;width:46px;height:56px}
.pot svg{width:100%;height:100%;overflow:visible}
.pot.sm{width:38px;height:46px}.pot.lg{width:84px;height:102px}.pot.xl{width:86px;height:104px}
.boing .pot{animation:boing .7s ease}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.16,.86)}55%{transform:scale(.93,1.08)}75%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
/* Listen */
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row+.row{border-top:1.5px solid var(--line)}
.rowmain{display:flex;gap:12px;align-items:center;background:none;border:0;padding:0;width:100%;text-align:left}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rn{font-weight:800;font-size:1.03rem;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rm{font-size:.84rem;color:var(--muted);font-weight:600}
.rs{flex:none;text-align:right;font-size:.82rem;font-weight:900;max-width:36%}
.rs.leaf{color:var(--leaf)}.rs.sun{color:var(--sun)}.rs.alert{color:var(--alert)}.rs.frost{color:var(--frost)}
.gauge{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px;max-width:170px}
.gauge i{display:block;height:100%;background:var(--water);border-radius:3px}
.gauge.late{background:var(--alert-soft)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.sun{background:var(--sun-soft);color:var(--sun)}
.mini-flame{display:inline-flex;align-items:center;gap:2px;color:var(--flame);font-size:.8rem;font-weight:900}
/* Knöpfe */
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;background:var(--surface);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.btn.water{background:var(--water);color:var(--on-water)}
.btn.leaf{background:var(--leaf);color:var(--on-leaf)}
.btn.soft{background:var(--bg);box-shadow:inset 0 0 0 2px var(--line),inset 0 -4px 0 var(--line)}
.btn.fert{background:var(--sun-soft);color:var(--sun);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.btn.danger{background:var(--alert-soft);color:var(--alert);box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:12px}
.link{background:none;border:0;padding:0;color:var(--leaf);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.note{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:12px 14px;font-size:.9rem;color:var(--muted);box-shadow:var(--shadow)}
.note p{flex:1 1 200px}
.season{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted);font-weight:700;padding:0 4px}
.empty{padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
/* Auswahl */
.search{position:relative}
.search input{width:100%;padding:14px 14px 14px 44px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:1rem;font-weight:700}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;font-weight:800;font-size:.88rem;white-space:nowrap;display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.opt small{font-weight:600;font-size:.74rem;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:0;border-radius:18px;box-shadow:var(--shadow);padding:10px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.85rem;min-width:0}
.tile span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
/* Foto */
.snap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:16px}
.snap .ico{grid-row:span 2;width:50px;height:50px;border-radius:16px;background:var(--hero-soft);display:flex;align-items:center;justify-content:center}
.snap b{font-size:1.15rem;font-weight:900}
.snap p{font-size:.88rem;opacity:.9}
.snap .acts{grid-column:1/-1;margin-top:10px}
.snap .btn{background:#FFFFFF;color:#2F6B45}
.snap .btn.ghost{background:transparent;color:var(--hero-ink);box-shadow:inset 0 0 0 2px var(--hero-soft)}
.scan{position:relative;border-radius:22px;overflow:hidden;background:var(--line);aspect-ratio:1;max-width:100%}
.scan img{width:100%;height:100%;object-fit:cover;display:block}
.scan::after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.35),transparent);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{to{top:100%}}
.photo{flex:none;width:84px;height:84px;border-radius:18px;object-fit:cover;background:var(--line)}
.health{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px;background:var(--leaf-soft)}
.health.mittel{background:var(--sun-soft)}.health.schlecht{background:var(--alert-soft)}
.health .hh{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.health .hh b{font-size:1.1rem;font-weight:900}
.score{display:flex;gap:3px}
.score i{width:9px;height:14px;border-radius:3px;background:var(--line)}
.health .score i.on{background:var(--leaf)}.health.mittel .score i.on{background:var(--sun)}.health.schlecht .score i.on{background:var(--alert)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.todo{display:flex;gap:10px;align-items:flex-start;background:none;border:0;padding:4px 0;text-align:left;width:100%;font-weight:700}
.todo .box{flex:none;width:22px;height:22px;border-radius:7px;border:2.5px solid var(--muted);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.todo.done .box{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.todo.done span:last-child{text-decoration:line-through;color:var(--muted)}
.diary{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.diary figure{margin:0;flex:none;width:76px;display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);font-weight:700}
.diary img{width:76px;height:76px;border-radius:14px;object-fit:cover;border:3px solid var(--line)}
.diary img.gut{border-color:var(--leaf)}.diary img.mittel{border-color:var(--sun)}.diary img.schlecht{border-color:var(--alert)}
/* Detail */
.back{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--leaf);font-weight:900;display:inline-flex;align-items:center;gap:4px}
.hero{display:flex;gap:14px;align-items:center}
.hero>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.say{display:inline-block;align-self:flex-start;background:var(--surface);border-radius:14px;padding:6px 11px;font-weight:800;font-size:.88rem;box-shadow:var(--shadow)}
.plan{padding:16px;display:flex;flex-direction:column;gap:14px}
.plan .big{font-size:1.5rem;font-weight:900;line-height:1.15}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--bg);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.fact span{font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.fact b{font-weight:900;overflow-wrap:anywhere}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;font-weight:600}
.hint svg{flex:none;color:var(--water);margin-top:2px}
.warn{color:var(--alert);font-size:.9rem;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.vdates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vdates input{display:block;min-width:0;width:100%;-webkit-appearance:none;appearance:none;min-height:50px;text-align:left}
.vname{flex:1;min-width:0;max-width:60%;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);font-weight:800;text-align:right}
details.more textarea{margin-top:4px}
.field label,.field .lbl{font-size:.85rem;font-weight:800;color:var(--muted)}
.field input,textarea{width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1rem;font-weight:700}
textarea{min-height:200px;font-size:.88rem;font-weight:600;line-height:1.5}
.err{color:var(--alert);font-size:.88rem;font-weight:800}
details.more{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
details.more summary{cursor:pointer;font-weight:900}
details.more[open] summary{margin-bottom:12px}
details.why summary{cursor:pointer;font-weight:800;color:var(--leaf);font-size:.9rem}
details.why ul{margin:8px 0 0}
.tips{display:flex;flex-direction:column;gap:12px;margin:0}
.tips div{display:flex;flex-direction:column;gap:2px}
.tips dt{font-size:.74rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--leaf)}
.tips dd{margin:0}
.calw{overflow-x:auto}
.cal{display:grid;grid-template-columns:52px repeat(12,minmax(18px,1fr));gap:3px;font-size:.72rem;min-width:300px}
.cal .h{text-align:center;color:var(--muted);font-weight:800}
.cal .h.now{color:var(--ink);text-decoration:underline}
.cal .rl{color:var(--muted);align-self:center;font-weight:700}
.cal i{height:14px;border-radius:4px;background:var(--line)}
.cal i.s{background:var(--leaf-soft);box-shadow:inset 0 0 0 1.5px var(--leaf)}
.cal i.p{background:var(--leaf)}
.cal i.h{background:var(--xp)}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{background:var(--surface);border-radius:8px;padding:3px 8px;font-size:.8rem;font-weight:700}
.ai{border:2px dashed var(--water);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ai p{font-size:.92rem}
.airow{display:flex;gap:10px;align-items:center}
.spin{flex:none;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--water);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Erfolge */
.lvlcard{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px}
.lvlcard .num{font-size:clamp(1.5rem,7.4vw,2.4rem);font-weight:900;line-height:1.05;overflow-wrap:break-word;hyphens:manual}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.5rem;font-weight:900}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{background:var(--surface);border-radius:18px;padding:12px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.badge .bi{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sun-soft);color:var(--flame)}
.badge.locked .bi{background:var(--bg);color:var(--faint)}
.badge.gold{grid-column:1/-1;flex-direction:row;text-align:left;gap:12px;padding:14px 16px;background:linear-gradient(135deg,var(--sun-soft),var(--surface))}
.badge.gold .bi{flex:none;background:var(--xp);color:#3A2600}
.badge.gold.locked .bi{background:var(--bg);color:var(--faint)}
.badge.gold b{font-size:1rem}
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.step{background:var(--surface);border-radius:16px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;box-shadow:var(--shadow);min-width:0}
.step b{font-size:.72rem;font-weight:900;line-height:1.15;hyphens:manual;max-width:100%}
.step .pot{width:46px;height:56px}
.step span{font-size:.66rem;color:var(--muted);font-weight:700}
.step.future .pot{opacity:.38;filter:grayscale(1)}
.step.now{box-shadow:inset 0 0 0 2.5px var(--xp),var(--shadow)}
.badge b{font-size:.82rem;font-weight:900;line-height:1.2}
.badge span{font-size:.72rem;color:var(--muted);font-weight:600;line-height:1.25}
/* Einstellungen */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.setrow+.setrow{border-top:1.5px solid var(--line)}
.setrow b{font-weight:800}
.linkrow{width:100%;background:none;border:0;text-align:left;color:inherit;text-decoration:none;font:inherit;cursor:pointer}
.list .linkrow+.linkrow{border-top:1.5px solid var(--line)}
.list .setrow+.linkrow{border-top:1.5px solid var(--line)}
.setrow input[type=time]{border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--bg);font-weight:800}
.sw{flex:none;width:52px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--leaf)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:900;color:var(--faint);min-height:50px;justify-content:center}
nav.tabs button[aria-current="page"]{color:var(--leaf)}
nav.tabs button.plus{flex:none;width:58px;height:48px;border-radius:16px;background:var(--leaf);color:var(--on-leaf);font-size:0;min-height:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;font-size:.92rem;font-weight:800;width:min(528px,calc(100% - 32px));display:flex;gap:12px;align-items:center;justify-content:space-between}
#toast.gold{background:var(--xp);color:#3A2600}
#toast button{background:none;border:0;color:inherit;font-weight:900;text-decoration:underline;flex:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
.topbtns{display:flex;gap:8px}
.step .rw{font-size:.62rem;color:var(--sun);font-weight:800;line-height:1.2}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pick{background:var(--surface);border:0;border-radius:16px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow);min-width:0;text-align:center}
.pick b{font-size:.72rem;font-weight:900;line-height:1.15}
.pick span:last-child{font-size:.64rem;color:var(--muted);font-weight:700}

{id:'begonie',n:'Begonie',a:'begonia',e:'🌺',c:'zimmer',l:'drinnen',d:2,ws:4,ww:7,th:2,tox:1,t:[['Standort','Hell bis halbschattig, ohne pralle Sonne.'],['Giessen','Leicht feucht halten und nicht über die Blätter giessen.'],['Pflege','Verblühtes regelmässig entfernen.']]},
{id:'pilea',n:'Ufopflanze',a:'pilea glückstaler',e:'🌱',c:'zimmer',l:'drinnen',d:1,ws:7,ww:10,th:2,tox:0,t:[['Standort','Hell, ohne direkte Mittagssonne.'],['Giessen','Giessen, wenn die obere Erde trocken ist. Hängende Blätter zeigen Durst.'],['Pflege','Regelmässig drehen, damit sie gerade wächst. Ableger lassen sich leicht verschenken.']]},
{id:'philodendron',n:'Philodendron',a:'baumfreund',e:'🌿',c:'zimmer',l:'drinnen',d:1,ws:7,ww:10,th:2,tox:1,t:[['Standort','Hell bis halbschattig.'],['Giessen','Giessen, wenn die oberen 2 cm trocken sind.'],['Pflege','Kletternde Arten freuen sich über einen Moosstab.']]},
{id:'areca',n:'Goldfruchtpalme',a:'areca zimmerpalme palme',e:'🌴',c:'zimmer',l:'drinnen',d:2,ws:6,ww:10,th:2,tox:0,t:[['Standort','Hell, ohne pralle Sonne.'],['Giessen','Gleichmässig leicht feucht halten, nicht austrocknen lassen.'],['Pflege','Mag hohe Luftfeuchtigkeit. Braune Spitzen zeigen zu trockene Luft.']]},
// Kräuter
{id:'basilikum',n:'Basilikum',a:'basil',e:'🌿',c:'kraut',l:'drinnen',d:2,ws:2,ww:3,wb:3,th:2,g:1,ann:1,act:R(5,9),cal:{s:[3,4,5],h:R(6,9)},t:[['Standort','Hell und warm, am liebsten über 20 °C. Draussen erst nach den Eisheiligen (Mitte Mai).'],['Giessen','Erde gleichmässig leicht feucht halten, am besten morgens. Kein Wasser im Untersetzer stehen lassen.'],['Pflege','Ganze Triebspitzen ernten statt einzelner Blätter, dann wird er buschig. Blüten ausbrechen.'],['Tipp','Basilikum aus dem Supermarkt in 2 bis 3 Teile teilen und umtopfen. So hält er viel länger.']]},
{id:'petersilie',n:'Petersilie',a:'',e:'🌿',c:'kraut',l:'balkon',d:1,ws:3,ww:5,wb:4,th:2,g:1,act:R(3,11),cal:{s:R(3,7),h:R(5,11)},t:[['Standort','Halbschattig, nicht in der prallen Sonne.'],['Giessen','Gleichmässig feucht halten, aber ohne Staunässe.'],['Pflege','Keimt langsam, bis zu 4 Wochen. Nicht jedes Jahr am gleichen Ort säen.']]},
{id:'schnittlauch',n:'Schnittlauch',a:'',e:'🌱',c:'kraut',l:'balkon',d:1,ws:3,ww:5,wb:4,th:2,g:1,act:R(3,10),cal:{s:[3,4,5],h:R(4,10)},t:[['Standort','Sonnig bis halbschattig.'],['Giessen','Mag es feucht, die Erde nicht austrocknen lassen.'],['Pflege','Halme 2 bis 3 cm über dem Boden abschneiden. Die Blüten sind essbar.']]},
{id:'minze',n:'Minze',a:'pfefferminze',e:'🌿',c:'kraut',l:'balkon',d:1,ws:2,ww:4,wb:3,th:3,g:2,act:R(4,10),cal:{p:[4,5],h:R(5,10)},t:[['Standort','Halbschattig.'],['Giessen','Braucht viel Wasser. Im Sommer täglich prüfen.'],['Pflege','Wuchert stark: im Beet nur mit Wurzelsperre, sonst lieber im Topf.']]},
{id:'rosmarin',n:'Rosmarin',a:'',e:'🌿',c:'kraut',l:'balkon',d:2,ws:6,ww:12,wb:10,th:1,g:1,act:R(4,10),cal:{p:[4,5],h:R(4,10)},t:[['Standort','Vollsonnig und warm.'],['Giessen','Sparsam giessen, Staunässe verträgt er gar nicht.'],['Winter','Nicht ganz winterhart. Im Topf hell und kühl (5 bis 10 °C) überwintern.']]},
{id:'thymian',n:'Thymian',a:'',e:'🌿',c:'kraut',l:'balkon',d:1,ws:6,ww:14,wb:10,th:1,g:1,act:R(4,10),cal:{p:[4,5],h:R(5,9)},t:[['Standort','Vollsonnig.'],['Giessen','Trockenheit verträgt er gut, Nässe nicht.'],['Pflege','Nach der Blüte zurückschneiden, aber nicht bis ins alte Holz.']]},
{id:'salbei',n:'Salbei',a:'',e:'🌿',c:'kraut',l:'balkon',d:1,ws:6,ww:14,wb:10,th:1,g:1,act:R(4,10),cal:{p:[4,5],h:R(5,10)},t:[['Standort','Sonnig.'],['Giessen','Mässig giessen, die Erde darf antrocknen.'],['Pflege','Im Frühling kräftig zurückschneiden, dann bleibt er kompakt.']]},
{id:'oregano',n:'Oregano',a:'origano',e:'🌿',c:'kraut',l:'balkon',d:1,ws:6,ww:14,wb:10,th:1,g:1,act:R(4,10),cal:{p:[4,5],h:R(6,9)},t:[['Standort','Sonnig.'],['Giessen','Sparsam giessen.'],['Ernte','Am aromatischsten kurz vor der Blüte.']]},
{id:'koriander',n:'Koriander',a:'',e:'🌿',c:'kraut',l:'balkon',d:2,ws:3,ww:4,wb:3,th:2,g:1,ann:1,act:R(4,9),cal:{s:R(4,8),h:R(5,9)},t:[['Standort','Sonnig bis halbschattig.'],['Giessen','Gleichmässig feucht halten. Bei Trockenheit blüht er schnell und wird bitter.'],['Pflege','Alle 3 bis 4 Wochen neu säen, dann kannst du laufend ernten.']]},
{id:'dill',n:'Dill',a:'',e:'🌿',c:'kraut',l:'balkon',d:1,ws:3,ww:4,wb:3,th:2,g:1,ann:1,act:R(4,9),cal:{s:R(4,7),h:R(6,9)},t:[['Standort','Sonnig und windgeschützt.'],['Giessen','Feucht halten, besonders bei Hitze.'],['Pflege','Direkt an den endgültigen Platz säen, er verträgt Umpflanzen schlecht.']]},
{id:'lavendel',n:'Lavendel',a:'',e:'💜',c:'kraut',l:'balkon',d:1,ws:10,ww:21,wb:14,th:1,g:2,act:R(4,10),cal:{p:[4,5,9],h:[6,7,8]},t:[['Standort','Vollsonnig, in magerer, durchlässiger Erde.'],['Giessen','Sehr wenig giessen. Im Beet ist es meist gar nicht nötig.'],['Pflege','Nach der Blüte um ein Drittel zurückschneiden.']]},
// Gemüse
{id:'tomaten',n:'Tomaten',a:'tomate',e:'🍅',c:'gemuese',l:'garten',d:2,ws:1,wb:3,th:3,g:5,ann:1,act:R(5,10),cal:{s:[3,4],p:[5],h:R(7,10)},t:[['Pflanzen','Drinnen ab März anziehen. Nach den Eisheiligen (Mitte Mai) an einen sonnigen, regengeschützten Platz setzen, gerne etwas tiefer.'],['Giessen','Im Beet 2 bis 3 Mal pro Woche durchdringend giessen, im Topf im Sommer täglich. Nur an die Wurzel, nie über die Blätter.'],['Pflege','Geiztriebe in den Blattachseln ausbrechen und die Pflanze an einem Stab führen. Ab der ersten Blüte düngen.'],['Ernte','Juli bis Oktober, wenn die Früchte voll ausgefärbt sind.']]},
{id:'gurken',n:'Gurken',a:'gurke',e:'🥒',c:'gemuese',l:'garten',d:2,ws:1,wb:2,th:3,g:4,ann:1,act:R(5,9),cal:{s:[4,5],p:[5,6],h:[7,8,9]},t:[['Pflanzen','Ab Ende April anziehen, ab Mitte Mai an einen warmen, geschützten Platz mit Rankhilfe setzen.'],['Giessen','Viel und gleichmässig, mit nicht zu kaltem Wasser. Mulch hält die Erde feucht.'],['Pflege','Alle 2 Wochen düngen. Oft ernten, dann setzt die Pflanze neue Früchte an.']]},
{id:'zucchetti',n:'Zucchetti (Zucchini)',a:'zucchini',e:'🥒',c:'gemuese',l:'garten',d:1,ws:1,wb:3,th:3,g:10,ann:1,act:R(5,9),cal:{s:[4,5],p:[5,6],h:R(6,9)},t:[['Pflanzen','Ab Mitte Mai mit viel Platz (etwa 1 m² pro Pflanze) in nährstoffreiche Erde setzen.'],['Giessen','Sehr durstig: 2 bis 3 Mal pro Woche kräftig giessen, nicht über die Blätter (sonst Mehltau).'],['Ernte','Früchte jung ernten (15 bis 20 cm), dann trägt die Pflanze mehr.']]},
{id:'peperoni',n:'Peperoni (Paprika)',a:'paprika chili',e:'🫑',c:'gemuese',l:'garten',d:2,ws:2,wb:3,th:2,g:3,ann:1,act:R(5,10),cal:{s:[2,3],p:[5],h:R(7,10)},t:[['Pflanzen','Früh anziehen (Februar oder März), ab Mitte Mai an den wärmsten Platz setzen.'],['Giessen','Gleichmässig feucht, aber nicht nass halten.'],['Pflege','Liebt Wärme: im Topf vor einer Südwand oder unter einem Dach gedeiht sie am besten.']]},
{id:'salat',n:'Salat',a:'kopfsalat pflücksalat lattich',e:'🥬',c:'gemuese',l:'garten',d:1,ws:2,wb:2,th:2,g:2,ann:1,act:R(3,10),cal:{s:R(3,8),p:R(4,8),h:R(5,10)},t:[['Pflanzen','Ab März alle 2 bis 3 Wochen neu säen oder setzen, dann hast du laufend Salat.'],['Giessen','Regelmässig und morgens giessen. Bei Trockenheit schiesst er und wird bitter.'],['Pflege','Gegen Schnecken: morgens statt abends giessen. Ein Schneckenzaun hilft.']]},
{id:'radieschen',n:'Radieschen',a:'',e:'🌱',c:'gemuese',l:'garten',d:1,ws:1,wb:2,th:2,g:5,u:'m2',ann:1,act:R(3,9),cal:{s:R(3,9),h:R(4,10)},t:[['Pflanzen','Von März bis September direkt ins Beet säen. Nach 4 bis 6 Wochen erntereif.'],['Giessen','Gleichmässig feucht halten, sonst werden sie holzig und scharf.'],['Tipp','Ideal für Anfänger und Kinder, weil es so schnell geht.']]},
{id:'karotten',n:'Karotten',a:'rüebli möhren',e:'🥕',c:'gemuese',l:'garten',d:2,ws:3,wb:4,th:2,g:10,u:'m2',ann:1,act:R(3,10),cal:{s:R(3,6),h:R(6,10)},t:[['Pflanzen','Ab März direkt in lockeren, steinfreien Boden säen.'],['Giessen','Bis zum Keimen feucht halten, danach seltener, dafür durchdringend.'],['Pflege','Zu dicht stehende Pflänzchen ausdünnen. Zwiebeln als Nachbarn halten die Möhrenfliege fern.']]},
{id:'bohnen',n:'Bohnen',a:'buschbohnen stangenbohnen',e:'🫘',c:'gemuese',l:'garten',d:1,ws:2,wb:4,th:2,g:10,u:'m2',ann:1,act:R(5,9),cal:{s:[5,6,7],h:[7,8,9]},t:[['Pflanzen','Ab Mitte Mai direkt säen, wenn der Boden warm ist.'],['Giessen','Ab der Blüte regelmässig giessen, vorher eher sparsam.'],['Wichtig','Roh sind Bohnen giftig, also immer kochen. Laufend ernten.']]},
{id:'erbsen',n:'Erbsen',a:'zuckererbsen kefen',e:'🫛',c:'gemuese',l:'garten',d:1,ws:2,wb:4,th:2,g:10,u:'m2',ann:1,act:R(3,7),cal:{s:[3,4,5],h:[6,7]},t:[['Pflanzen','Ab März direkt säen. Hohe Sorten brauchen eine Rankhilfe.'],['Giessen','Ab der Blüte gleichmässig feucht halten.'],['Tipp','Erbsen reichern den Boden mit Stickstoff an. Danach wachsen zum Beispiel Kohl oder Salat gut.']]},
{id:'kartoffeln',n:'Kartoffeln',a:'härdöpfel erdäpfel',e:'🥔',c:'gemuese',l:'garten',d:1,ws:3,wb:7,th:2,g:15,u:'m2',ann:1,act:R(4,9),cal:{p:[4,5],h:[7,8,9]},t:[['Pflanzen','Im April vorgekeimte Knollen etwa 10 cm tief setzen.'],['Giessen','Vor allem ab der Blüte bei Trockenheit giessen, an den Boden statt aufs Kraut.'],['Pflege','Mehrmals anhäufeln. Ernten, wenn das Kraut abstirbt.']]},
{id:'zwiebeln',n:'Zwiebeln',a:'zwiebel',e:'🧅',c:'gemuese',l:'garten',d:1,ws:3,wb:7,th:1,g:10,u:'m2',ann:1,act:R(3,8),cal:{p:[3,4],h:[7,8]},t:[['Pflanzen','Steckzwiebeln im März oder April setzen, die Spitze schaut heraus.'],['Giessen','Nur bei längerer Trockenheit giessen, ab Juli gar nicht mehr.'],['Ernte','Erntereif, wenn das Laub umknickt und gelb wird.']]},
{id:'knoblauch',n:'Knoblauch',a:'',e:'🧄',c:'gemuese',l:'garten',d:1,ws:4,wb:10,th:1,g:8,u:'m2',act:R(3,7),cal:{p:[3,10],h:[6,7,8]},t:[['Pflanzen','Zehen im Oktober oder März etwa 5 cm tief setzen.'],['Giessen','Wenig giessen, Staunässe vermeiden.'],['Ernte','Ernten, wenn etwa ein Drittel der Blätter gelb ist.']]},
{id:'kuerbis',n:'Kürbis',a:'kuerbis',e:'🎃',c:'gemuese',l:'garten',d:1,ws:1,wb:4,th:3,g:10,ann:1,act:R(5,10),cal:{s:[4,5],p:[5,6],h:R(8,10)},t:[['Pflanzen','Ab Mitte Mai mit viel Platz setzen, gerne direkt neben den Kompost.'],['Giessen','Durchdringend an die Wurzel giessen, nicht über die Blätter.'],['Ernte','Reif, wenn der Stiel verholzt ist und es beim Klopfen hohl klingt.']]},
{id:'mangold',n:'Mangold',a:'krautstiel',e:'🥬',c:'gemuese',l:'garten',d:1,ws:2,wb:3,th:2,g:3,ann:1,act:R(4,11),cal:{s:R(4,7),h:R(6,11)},t:[['Pflanzen','Ab April säen oder setzen.'],['Giessen','Gleichmässig feucht halten.'],['Ernte','Äussere Blätter laufend ernten und das Herz stehen lassen.']]},
{id:'spinat',n:'Spinat',a:'',e:'🥬',c:'gemuese',l:'garten',d:1,ws:2,wb:3,th:2,g:10,u:'m2',ann:1,act:R(3,11),cal:{s:[3,4,8,9],h:[4,5,6,9,10,11]},t:[['Pflanzen','Im Frühling oder ab August säen, nicht im Hochsommer.'],['Giessen','Feucht halten, sonst blüht er zu früh.'],['Ernte','Vor der Blüte ernten.']]},
{id:'kohlrabi',n:'Kohlrabi',a:'',e:'🥬',c:'gemuese',l:'garten',d:1,ws:2,wb:3,th:2,g:2,ann:1,act:R(4,10),cal:{s:R(3,6),p:R(4,7),h:R(5,10)},t:[['Pflanzen','Ab April Jungpflanzen setzen.'],['Giessen','Gleichmässig giessen, sonst platzen die Knollen.'],['Ernte','Ernten, wenn die Knolle etwa so gross wie ein Tennisball ist.']]},
{id:'rhabarber',n:'Rhabarber',a:'',e:'🌱',c:'gemuese',l:'garten',d:1,ws:3,wb:5,th:3,g:10,act:R(4,9),cal:{p:[3,10],h:[4,5,6]},t:[['Pflanzen','Mehrjährig. Im Herbst oder Frühling an einen sonnigen Platz mit viel Raum setzen.'],['Giessen','Die grossen Blätter verdunsten viel: bei Trockenheit kräftig giessen.'],['Ernte','Nur bis Ende Juni ernten, dann braucht die Pflanze Ruhe. Die Blätter nicht essen.']]},
// Obst
{id:'erdbeeren',n:'Erdbeeren',a:'erdbeere',e:'🍓',c:'obst',l:'garten',d:1,ws:2,wb:3,th:2,g:2,act:R(4,10),cal:{p:[3,4,7,8],h:[5,6,7]},t:[['Pflanzen','Neue Pflanzen am besten im Juli oder August setzen. Das Herz nicht mit Erde bedecken.'],['Giessen','Regelmässig giessen, vor allem während Blüte und Fruchtbildung. Morgens und nicht über die Früchte.'],['Pflege','Stroh unter die Früchte legen. Ausläufer entfernen, wenn du keine neuen Pflanzen willst.']]},
{id:'himbeeren',n:'Himbeeren',a:'himbeere',e:'🌿',c:'obst',l:'garten',d:1,ws:2,wb:4,th:3,g:10,act:R(4,10),cal:{p:[3,10,11],h:R(6,9)},t:[['Pflanzen','Im Herbst oder Frühling an einen sonnigen Platz mit Rankgerüst setzen.'],['Giessen','Flache Wurzeln: bei Trockenheit regelmässig giessen und den Boden mulchen.'],['Pflege','Abgetragene Ruten nach der Ernte bodennah abschneiden.']]},
{id:'johannisbeeren',n:'Johannisbeeren',a:'meertrübeli träubeli',e:'🌿',c:'obst',l:'garten',d:1,ws:3,wb:7,th:2,g:10,act:R(4,9),cal:{p:[3,10,11],h:[6,7,8]},t:[['Pflanzen','Im Herbst setzen, sonnig bis halbschattig.'],['Giessen','Vor allem während der Fruchtbildung bei Trockenheit giessen.'],['Pflege','Im Winter alte Triebe auslichten.']]},
{id:'heidelbeeren',n:'Heidelbeeren',a:'blaubeeren',e:'🫐',c:'obst',l:'balkon',d:2,ws:2,wb:3,th:2,g:5,act:R(4,10),m:'Mit Regenwasser giessen. Leitungswasser ist oft zu kalkhaltig.',cal:{p:[3,4,10],h:[7,8,9]},t:[['Pflanzen','Braucht saure Moorbeet- oder Rhododendronerde. Im Topf ist das am einfachsten.'],['Giessen','Nie austrocknen lassen.'],['Tipp','Zwei verschiedene Sorten nebeneinander bringen mehr Ertrag.']]},
{id:'apfelbaum',n:'Apfelbaum',a:'apfel äpfel',e:'🍎',c:'obst',l:'garten',d:2,ws:4,wb:7,th:3,g:20,act:R(4,10),cal:{p:[3,4,10,11],h:R(8,10)},t:[['Pflanzen','Im Herbst oder Frühling sonnig setzen. Viele Sorten brauchen einen zweiten Apfelbaum in der Nähe.'],['Giessen','In den ersten 2 bis 3 Jahren bei Trockenheit wöchentlich kräftig giessen. Ältere Bäume nur bei langer Trockenheit.'],['Pflege','Schnitt im Spätwinter. Zu viele Früchte im Juni ausdünnen.']]},
{id:'kirschbaum',n:'Kirschbaum',a:'kirschen chriesi',e:'🍒',c:'obst',l:'garten',d:2,ws:4,wb:7,th:3,g:20,act:R(4,9),cal:{p:[3,4,10,11],h:[6,7]},t:[['Pflanzen','Sonnig setzen. Süsskirschen brauchen meist eine zweite Sorte zur Befruchtung.'],['Giessen','Junge Bäume bei Trockenheit wöchentlich giessen.'],['Pflege','Am besten im Sommer direkt nach der Ernte schneiden. Ein Netz schützt vor Vögeln.']]},
{id:'trauben',n:'Trauben',a:'reben weintrauben',e:'🍇',c:'obst',l:'garten',d:2,ws:3,wb:10,th:2,g:20,act:R(4,9),cal:{p:[4,5],h:[9,10]},t:[['Pflanzen','Im Frühling an eine sonnige, warme Hauswand oder ans Spalier setzen. Pilzwiderstandsfähige (PIWI) Sorten machen weniger Arbeit.'],['Giessen','Im ersten Jahr regelmässig, später nur bei langer Trockenheit.'],['Pflege','Hauptschnitt im Spätwinter, im Sommer überflüssige Triebe entfernen.']]},
{id:'feigen',n:'Feigen',a:'feige',e:'🌳',c:'obst',l:'balkon',d:2,ws:2,wb:7,th:3,g:10,act:R(4,10),cal:{p:[4,5],h:[8,9,10]},t:[['Pflanzen','Sonnig, warm und geschützt. Im Kübel am einfachsten.'],['Giessen','Gleichmässig feucht ohne Staunässe. Im Hochsommer im Topf oft täglich.'],['Winter','Im Kübel frostfrei überwintern. Im Freiland nur in milden Lagen mit Winterschutz.']]},
// Blumen und Sträucher
{id:'geranien',n:'Geranien',a:'pelargonien geranie',e:'🌺',c:'blume',l:'balkon',d:1,ws:2,ww:21,wb:3,th:2,g:2,tox:1,act:R(5,9),t:[['Standort','Sonnig. Der Klassiker für Balkonkisten.'],['Giessen','Im Sommer täglich prüfen. Die Erde darf zwischendurch leicht abtrocknen, Staunässe vermeiden.'],['Pflege','Verblühtes ausbrechen und alle 1 bis 2 Wochen düngen.'],['Winter','Vor dem ersten Frost hereinholen und hell und kühl (5 bis 10 °C) überwintern. Dann nur ganz wenig giessen.']]},
{id:'petunien',n:'Petunien',a:'petunie surfinien',e:'🌸',c:'blume',l:'balkon',d:1,ws:1,wb:2,th:3,g:2,ann:1,act:R(5,9),t:[['Standort','Vollsonnig.'],['Giessen','Sehr durstig: im Sommer täglich, bei Hitze morgens und abends.'],['Pflege','Wöchentlich düngen, sonst werden die Blätter gelb. Verblühtes regelmässig entfernen.']]},
{id:'rosen',n:'Rosen',a:'rose',e:'🌹',c:'blume',l:'garten',d:2,ws:2,wb:7,th:2,g:10,act:R(4,10),t:[['Standort','Sonnig und luftig, damit die Blätter nach Regen schnell trocknen.'],['Giessen','Selten, aber durchdringend an die Wurzel giessen, nie über die Blätter.'],['Pflege','Hauptschnitt im Frühling, wenn die Forsythien blühen. Verblühtes laufend abschneiden.']]},
{id:'hortensien',n:'Hortensien',a:'hortensie hydrangea',e:'💠',c:'blume',l:'garten',d:2,ws:1,wb:3,th:3,g:10,tox:1,act:R(4,10),m:'Am besten mit kalkarmem Regenwasser giessen.',t:[['Standort','Halbschattig, ohne pralle Mittagssonne.'],['Giessen','Sehr durstig. An heissen Tagen im Topf auch zweimal täglich prüfen.'],['Pflege','Bauernhortensien kaum schneiden, nur die alten Blüten im Frühling entfernen.']]},
{id:'olivenbaum',n:'Olivenbaum',a:'olive olivenbäumchen',e:'🫒',c:'blume',l:'balkon',d:2,ws:4,wb:7,th:2,g:10,act:R(4,10),t:[['Standort','Vollsonnig und warm, am besten im Kübel.'],['Giessen','Mässig giessen, die Erde darf zwischendurch antrocknen.'],['Winter','Verträgt leichten Frost bis etwa minus 5 °C. Bei stärkerem Frost hell und kühl überwintern.']]},
{id:'oleander',n:'Oleander',a:'',e:'🌺',c:'blume',l:'balkon',d:2,ws:2,wb:4,th:3,g:5,tox:1,act:R(4,10),t:[['Standort','Vollsonnig und warm.'],['Giessen','Braucht im Sommer viel Wasser. Etwas Wasser im Untersetzer schadet ihm nicht.'],['Winter','Hell und kühl (5 bis 10 °C) überwintern. Alle Teile sind sehr giftig.']]},
// Weitere Zimmerpflanzen
{id:'alocasia',n:'Alocasia',a:'pfeilblatt elefantenohr',e:'🌿',c:'zimmer',l:'drinnen',d:3,ws:5,ww:9,th:2,tox:1,t:[['Standort','Hell, ohne direkte Sonne und warm (über 18 °C).'],['Giessen','Gleichmässig leicht feucht halten, die obersten 2 cm dürfen antrocknen. Staunässe lässt die Knollen faulen.'],['Pflege','Mag hohe Luftfeuchtigkeit. Im Winter wirft sie manchmal Blätter ab, das ist normal.']]},

{id:'bromelie',n:'Bromelie',a:'guzmania lanzenrosette ananasgewächs',e:'🌺',c:'zimmer',l:'drinnen',d:1,ws:7,ww:10,th:1,m:'Etwas Wasser in den Blatttrichter giessen und alle paar Wochen erneuern. Die Erde nur leicht feucht halten.',t:[['Standort','Hell, ohne pralle Sonne und warm.'],['Giessen','Kalkarmes, zimmerwarmes Wasser verwenden.'],['Pflege','Sie blüht nur einmal. Danach bildet sie Kindel, die du abtrennen und einpflanzen kannst.']]},
{id:'kalanchoe',n:'Flammendes Käthchen',a:'kalanchoe',e:'🌺',c:'zimmer',l:'drinnen',d:1,ws:10,ww:14,th:1,tox:1,t:[['Standort','Hell, gerne mit etwas Sonne.'],['Giessen','Sukkulent: erst giessen, wenn die Erde trocken ist.'],['Pflege','Verblühtes abschneiden. Nach einer kurzen Tagesphase im Herbst blüht sie wieder.']]},
{id:'tillandsie',n:'Tillandsie',a:'luftpflanze airplant',e:'🌿',c:'zimmer',l:'drinnen',d:1,ws:7,ww:10,th:1,m:'Einmal pro Woche 20 Minuten in Wasser tauchen oder kräftig besprühen, danach kopfüber gut trocknen lassen.',t:[['Standort','Hell, ohne pralle Mittagssonne. Braucht keine Erde.'],['Giessen','Am besten mit Regenwasser oder abgestandenem Wasser. Graue, eingerollte Blätter zeigen Durst.'],['Tipp','Nach dem Tauchen nicht nass in einen geschlossenen Behälter legen, sonst fault sie.']]},
{id:'venusfliegenfalle',n:'Venusfliegenfalle',a:'dionaea fleischfressende pflanze',e:'🌿',c:'zimmer',l:'drinnen',d:3,ws:2,ww:7,th:3,m:'Nur Regenwasser oder destilliertes Wasser. Am besten 1 bis 2 cm Wasser in den Untersetzer stellen.',t:[['Standort','Sehr hell und sonnig. Im Sommer gerne draussen.'],['Giessen','Im Sommer immer feucht halten. Leitungswasser schadet ihr wegen des Kalks.'],['Pflege','Nicht mit dem Finger auslösen und nicht düngen. Im Winter braucht sie eine kühle Ruhezeit.']]},
{id:'kaffeepflanze',n:'Kaffeepflanze',a:'coffea kaffee',e:'🌿',c:'zimmer',l:'drinnen',d:2,ws:4,ww:7,th:2,tox:1,t:[['Standort','Hell, ohne pralle Mittagssonne und warm (über 15 °C).'],['Giessen','Gleichmässig leicht feucht halten, mit kalkarmem Wasser.'],['Tipp','Nach einigen Jahren blüht sie weiss und duftend. Daraus werden rote Kaffeekirschen.']]},
{id:'avocado',n:'Avocado',a:'avocadobaum avocadokern',e:'🥑',c:'zimmer',l:'drinnen',d:2,ws:5,ww:9,th:2,tox:1,t:[['Standort','Hell und warm. Im Sommer darf sie raus.'],['Giessen','Gleichmässig feucht halten. Braune Blattränder zeigen zu trockene Erde oder kalkiges Wasser.'],['Tipp','Den Kern mit Zahnstochern halb ins Wasserglas hängen. Nach 4 bis 8 Wochen keimt er.']]},
{id:'maranta',n:'Pfeilwurz',a:'maranta gebetspflanze',e:'🌿',c:'zimmer',l:'drinnen',d:2,ws:4,ww:6,th:2,t:[['Standort','Halbschattig, ohne direkte Sonne.'],['Giessen','Leicht feucht halten, mit zimmerwarmem, kalkarmem Wasser.'],['Tipp','Am Abend faltet sie ihre Blätter nach oben wie zum Gebet.']]},
{id:'efeu',n:'Efeu',a:'hedera',e:'🌿',c:'zimmer',l:'drinnen',d:1,ws:5,ww:9,th:2,tox:1,t:[['Standort','Hell bis halbschattig und eher kühl.'],['Giessen','Mässig giessen. Die obere Erde darf antrocknen.'],['Pflege','In warmer, trockener Heizungsluft kommen leicht Spinnmilben. Ab und zu abduschen.']]},
{id:'croton',n:'Wunderstrauch',a:'croton codiaeum',e:'🌿',c:'zimmer',l:'drinnen',d:3,ws:4,ww:7,th:2,tox:1,t:[['Standort','Sehr hell, gerne mit etwas Sonne. Dann werden die Blätter schön bunt.'],['Giessen','Gleichmässig leicht feucht halten, mit zimmerwarmem Wasser.'],['Pflege','Den Platz nicht wechseln und Zugluft vermeiden, sonst wirft er Blätter ab.']]},
{id:'haworthia',n:'Haworthie',a:'haworthia zebrapflanze',e:'🌵',c:'zimmer',l:'drinnen',d:1,ws:14,ww:28,th:1,t:[['Standort','Hell, aber ohne pralle Mittagssonne. Gut fürs Fensterbrett.'],['Giessen','Sehr sparsam, erst wenn die Erde ganz trocken ist.'],['Pflege','Kakteenerde verwenden. Fast keine Pflege nötig.']]},
// Balkon und Blumen
{id:'kapuzinerkresse',n:'Kapuzinerkresse',a:'tropaeolum',e:'🌼',c:'blume',l:'balkon',d:1,ws:2,wb:4,th:2,g:2,ann:1,act:R(5,10),cal:{s:[4,5],h:R(6,10)},t:[['Standort','Sonnig bis halbschattig. Rankt oder hängt schön aus der Balkonkiste.'],['Giessen','Regelmässig giessen, an heissen Tagen täglich.'],['Tipp','Blüten und Blätter sind essbar und schmecken leicht scharf. Nicht düngen, sonst gibt es mehr Blätter als Blüten.']]},
{id:'lobelien',n:'Männertreu',a:'lobelie lobelia',e:'💙',c:'blume',l:'balkon',d:2,ws:1,wb:3,th:3,g:2,ann:1,tox:1,act:R(5,9),t:[['Standort','Sonnig bis halbschattig.'],['Giessen','Darf nie austrocknen: im Sommer täglich giessen.'],['Pflege','Nach der ersten Blüte um ein Drittel zurückschneiden, dann blüht sie nochmals.']]},
{id:'fleissigeslieschen',n:'Fleissiges Lieschen',a:'impatiens',e:'🌸',c:'blume',l:'balkon',d:1,ws:2,wb:3,th:3,g:2,ann:1,act:R(5,9),t:[['Standort','Halbschattig bis schattig. Ideal für Nordbalkone.'],['Giessen','Gleichmässig feucht halten. Schlappe Triebe zeigen Durst.'],['Pflege','Blüht von Mai bis Oktober fast ohne Pflege. Alle 2 Wochen düngen.']]},
{id:'tagetes',n:'Studentenblume',a:'tagetes samtblume',e:'🌼',c:'blume',l:'balkon',d:1,ws:2,wb:4,th:2,g:2,ann:1,act:R(5,10),t:[['Standort','Sonnig.'],['Giessen','Regelmässig giessen, Erde darf zwischendurch leicht antrocknen.'],['Tipp','Zwischen Tomaten und Gemüse gepflanzt hält sie Schädlinge im Boden fern. Schnecken lieben sie leider.']]},
{id:'ringelblume',n:'Ringelblume',a:'calendula',e:'🌼',c:'blume',l:'garten',d:1,ws:2,wb:5,th:2,g:2,ann:1,act:R(5,10),cal:{s:[3,4,5],h:R(6,10)},t:[['Standort','Sonnig. Wächst auch in einfacher Gartenerde.'],['Giessen','Mässig giessen, nur bei Trockenheit.'],['Tipp','Die Blüten sind essbar und gut für Salben. Verblühtes abschneiden, dann blüht sie bis zum Frost.']]},
{id:'zauberglocken',n:'Zauberglöckchen',a:'calibrachoa million bells minipetunie',e:'🌸',c:'blume',l:'balkon',d:1,ws:1,wb:3,th:3,g:2,ann:1,act:R(5,9),t:[['Standort','Sonnig. Hängt schön aus Ampeln und Kisten.'],['Giessen','Im Sommer täglich giessen. Kalkarmes Wasser verhindert gelbe Blätter.'],['Pflege','Jede Woche düngen. Verblühtes muss man nicht ausbrechen.']]},
{id:'bougainvillea',n:'Bougainvillea',a:'drillingsblume',e:'🌺',c:'blume',l:'balkon',d:2,ws:2,ww:14,th:2,g:3,act:R(5,9),t:[['Standort','Vollsonnig und warm, am besten an einer Hauswand.'],['Giessen','Im Sommer regelmässig giessen, die Erde darf zwischendurch antrocknen.'],['Winter','Nicht winterhart: hell und bei 8 bis 12 °C überwintern und nur wenig giessen.']]},
{id:'chrysanthemen',n:'Chrysanthemen',a:'herbstchrysantheme winteraster',e:'🌼',c:'blume',l:'balkon',d:1,ws:2,wb:4,th:2,g:2,tox:1,act:R(8,11),t:[['Standort','Sonnig bis halbschattig. Die Herbstblume für Balkon und Grab.'],['Giessen','Gleichmässig feucht halten, nie austrocknen lassen.'],['Pflege','Verblühtes abschneiden. Winterharte Sorten im Frühling zurückschneiden.']]},
{id:'heide',n:'Besenheide',a:'heide calluna erika',e:'🌸',c:'blume',l:'balkon',d:1,ws:3,wb:7,th:2,g:1,act:R(3,11),t:[['Standort','Sonnig bis halbschattig, in saurer Erde (Rhododendronerde).'],['Giessen','Mit kalkarmem Wasser leicht feucht halten. Ausgetrocknet erholt sie sich kaum.'],['Pflege','Im Frühling leicht zurückschneiden. An frostfreien Wintertagen giessen.']]},
{id:'clematis',n:'Clematis',a:'waldrebe',e:'🌸',c:'blume',l:'garten',d:2,ws:2,wb:5,th:3,g:5,tox:1,act:R(4,10),t:[['Standort','Kopf in der Sonne, Fuss im Schatten: den Wurzelbereich mit Steinen oder niedrigen Pflanzen beschatten.'],['Giessen','Regelmässig und durchdringend giessen, im Topf im Sommer fast täglich.'],['Pflege','Braucht ein Rankgitter. Der Schnitt hängt von der Sorte ab.']]},
{id:'narzissen',n:'Narzissen',a:'osterglocken narzisse',e:'🌼',c:'blume',l:'garten',d:1,ws:4,wb:7,th:1,g:2,tox:1,act:[3,4,5],t:[['Pflanzen','Zwiebeln im September oder Oktober etwa 15 cm tief setzen.'],['Giessen','Nur in einem trockenen Frühling giessen.'],['Pflege','Laub nach der Blüte einziehen lassen. Giftig, auch für Haustiere.']]},
{id:'hyazinthen',n:'Hyazinthen',a:'hyazinthe',e:'💜',c:'blume',l:'garten',d:1,ws:4,wb:7,th:1,g:2,tox:1,act:[3,4,5],t:[['Pflanzen','Zwiebeln im Oktober etwa 15 cm tief setzen. Im Topf auch drinnen schön.'],['Giessen','Mässig giessen, die Zwiebel darf nicht im Wasser stehen.'],['Tipp','Duften stark. Beim Umgang mit den Zwiebeln Handschuhe tragen, sie können die Haut reizen.']]},
{id:'pfingstrosen',n:'Pfingstrosen',a:'pfingstrose paeonie',e:'🌸',c:'blume',l:'garten',d:1,ws:3,wb:7,th:2,g:5,tox:1,act:R(4,9),t:[['Standort','Sonnig, an einem festen Platz. Sie mögen kein Umpflanzen.'],['Giessen','Bei Trockenheit kräftig giessen, besonders vor der Blüte.'],['Pflege','Nicht zu tief pflanzen, sonst blühen sie nicht. Die schweren Blüten stützen.']]},
{id:'funkien',n:'Funkien',a:'hosta funkie',e:'🌿',c:'blume',l:'garten',d:1,ws:2,wb:4,th:3,g:3,tox:1,act:R(4,9),t:[['Standort','Halbschattig bis schattig. Perfekt für schattige Ecken.'],['Giessen','Regelmässig giessen, sie mögen feuchten Boden.'],['Pflege','Schnecken lieben die Blätter. Im Topf sind sie besser geschützt.']]},
// Gemüse
{id:'chili',n:'Chili',a:'peperoncini scharf pfefferoni',e:'🌶️',c:'gemuese',l:'balkon',d:2,ws:2,wb:3,th:2,g:2,ann:1,act:R(5,10),cal:{s:[2,3],p:[5],h:R(7,10)},t:[['Pflanzen','Ab Februar drinnen warm vorziehen. Nach den Eisheiligen an einen sonnigen, warmen Platz.'],['Giessen','Gleichmässig giessen, die Erde darf oben leicht antrocknen. Zu viel Wasser macht sie weniger scharf.'],['Ernte','Ernten, wenn die Schoten voll ausgefärbt sind. Lässt sich drinnen überwintern.']]},
{id:'mais',n:'Mais',a:'zuckermais maiskolben',e:'🌽',c:'gemuese',l:'garten',d:1,ws:2,wb:4,th:3,g:5,u:'m2',ann:1,act:R(5,9),cal:{s:[5],h:[8,9]},t:[['Pflanzen','Ab Mitte Mai direkt ins Beet säen, in Blöcken statt in einer Reihe, damit er sich bestäubt.'],['Giessen','Vor allem während der Blüte und Kolbenbildung kräftig giessen.'],['Ernte','Reif, wenn die Fäden braun sind und beim Eindrücken eines Korns milchiger Saft kommt.']]},
{id:'blumenkohl',n:'Blumenkohl',a:'karfiol',e:'🥦',c:'gemuese',l:'garten',d:3,ws:2,wb:3,th:3,g:4,ann:1,act:R(4,10),cal:{s:[3,4],p:[4,5,6],h:R(6,10)},t:[['Pflanzen','Jungpflanzen ab April in nährstoffreichen Boden setzen.'],['Giessen','Gleichmässig feucht halten. Trockenheit führt zu kleinen Köpfen.'],['Pflege','Grosse Blätter über den Kopf knicken, damit er schön weiss bleibt.']]},

{id:'sellerie',n:'Sellerie',a:'knollensellerie stangensellerie',e:'🥬',c:'gemuese',l:'garten',d:2,ws:2,wb:3,th:3,g:4,ann:1,act:R(5,10),cal:{s:[2,3],p:[5],h:[9,10]},t:[['Pflanzen','Jungpflanzen ab Mitte Mai flach setzen, die Knolle soll nicht in der Erde verschwinden.'],['Giessen','Braucht viel Wasser: gleichmässig feucht halten.'],['Ernte','Knollen im Oktober vor dem ersten starken Frost ernten.']]},
{id:'federkohl',n:'Federkohl (Grünkohl)',a:'grünkohl kale',e:'🥬',c:'gemuese',l:'garten',d:1,ws:2,wb:4,th:2,g:4,ann:1,act:R(5,11),cal:{s:[5,6],p:[6,7],h:[10,11,12,1,2]},t:[['Pflanzen','Im Juni oder Juli mit 40 cm Abstand pflanzen.'],['Giessen','Im Sommer regelmässig giessen.'],['Ernte','Nach dem ersten Frost schmeckt er süsser. Immer die unteren Blätter ernten, er wächst oben weiter.']]},
{id:'fruehlingszwiebeln',n:'Frühlingszwiebeln',a:'lauchzwiebeln bundzwiebeln',e:'🌱',c:'gemuese',l:'balkon',d:1,ws:2,wb:4,th:2,g:2,u:'m2',ann:1,act:R(4,9),cal:{s:R(3,7),h:R(5,10)},t:[['Pflanzen','Von März bis Juli in Reihen säen, gerne auch in der Balkonkiste.'],['Giessen','Gleichmässig leicht feucht halten.'],['Tipp','Die weissen Wurzelenden aus dem Laden in ein Glas Wasser stellen, dann wachsen sie nach.']]},
// Obst und Beeren

 ['Welche Daten die App speichert','Die Pflanzen, die du anlegst (Name, Art, Standort, Raum, Topfgrösse), wann du gegossen und gedüngt hast, deine Antworten zu Wohnung und Erinnerungszeit, deine Punkte, Abzeichen und Einstellungen sowie, in der Version innerhalb von Claude, kleine Vorschaubilder deiner Foto-Checks. Diese Daten bleiben auf deinem Gerät. Wir haben keinen Zugriff darauf.'],

 ['Wetter','Nur wenn du «Regen automatisch erkennen» einschaltest: Die App schickt den Ort, den du eintippst, und dessen Koordinaten direkt an den Wetterdienst Open-Meteo (OpenMeteo GmbH, Bürglen UR, Schweiz), um Regenmengen und Temperaturen abzufragen. Dabei wird technisch auch die IP-Adresse deines Geräts übermittelt. Laut Open-Meteo werden Server-Protokolle nach spätestens 90 Tagen gelöscht. Die Standortfreigabe deines iPhones wird nicht verwendet. Du kannst die Funktion jederzeit ausschalten.'],

 ['Speicherdauer','Die Daten in der App bleiben auf deinem Gerät, bis du sie löschst oder die App entfernst. Open-Meteo löscht seine Server-Protokolle nach spätestens 90 Tagen. E-Mails an uns löschen wir, sobald sie erledigt sind.'],
 ['Rechtsgrundlage','Für die Wetterabfrage ist deine Einwilligung die Grundlage (Art. 6 Abs. 1 lit. a DSGVO): Du gibst sie, wenn du die Funktion einschaltest, und widerrufst sie, wenn du sie ausschaltest. E-Mails beantworten wir, weil du uns darum bittest und wir ein berechtigtes Interesse daran haben, dir zu helfen (Art. 6 Abs. 1 lit. b und f DSGVO). Die Protokolle der Webseite speichert GitHub aus berechtigtem Interesse an einem sicheren Betrieb (Art. 6 Abs. 1 lit. f DSGVO). Alle anderen Daten verarbeitest du nur selbst auf deinem Gerät.'],
 ['Übermittlung ins Ausland','Open-Meteo sitzt in der Schweiz. GitHub und Microsoft (Outlook) sitzen in den USA. Sie sind unter dem EU-US Data Privacy Framework und dem Swiss-US Data Privacy Framework zertifiziert, die von der EU und der Schweiz als angemessener Datenschutz anerkannt sind. Apple ist für den App Store selbst verantwortlich und regelt die Übermittlung in seinen eigenen Datenschutzbestimmungen.'],
 ['Freiwillig und ohne automatische Entscheide','Du musst uns keine Daten geben. Die App funktioniert ohne Wetterabfrage und ohne E-Mail an uns. Es gibt keine automatisierten Entscheidungen und kein Profiling.'],
 ['Löschen','In den Einstellungen unter «Daten» kannst du alle Pflanzen, Punkte und Fotos löschen. Auch wenn du die App vom iPhone entfernst, werden alle Daten gelöscht.'],
 ['Deine Rechte','Du hast das Recht auf Auskunft, Berichtigung, Löschung und Herausgabe deiner Daten sowie auf Widerruf einer Einwilligung. Du kannst einer Verarbeitung auch widersprechen oder ihre Einschränkung verlangen. Weil wir keine Daten von dir auf einem Server speichern, gibt es bei uns in der Regel nichts herauszugeben oder zu löschen. Schreib uns trotzdem jederzeit an '+MAIL+'. Du kannst dich auch beim Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB) beschweren oder, wenn du in der EU wohnst, bei der Datenschutzbehörde deines Landes.'],

 ['Pflegetipps sind Empfehlungen','Giessrhythmus, Wassermenge, Düngung und Tipps sind Richtwerte für das Klima in der Schweiz, in Deutschland und in Österreich. Jede Pflanze, jeder Standort und jede Erde ist anders. Prüf vor dem Giessen mit der Fingerprobe, ob die Erde trocken ist, und pass den Plan an, wenn deine Pflanze anders reagiert.'],

async function wxCheck(force){

    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lon+'&hourly=precipitation,temperature_2m&past_days=3&forecast_days=2&timezone=auto');
    const j=await r.json(),now=new Date(),cut=isoLocal(now)+'T'+String(now.getHours()).padStart(2,'0')+':00',sums={};
    (j.hourly&&j.hourly.time||[]).forEach((t,i)=>{if(t<=cut){const d=t.slice(0,10);sums[d]=(sums[d]||0)+(Number(j.hourly.precipitation[i])||0)}});
    w.days=Object.keys(sums).sort().map(d=>({d:d,mm:Math.round(sums[d]*10)/10}));w.last=Date.now();w.err='';
    const lim=new Date(now.getTime()+36*3600e3),limS=isoLocal(lim.getTime())+'T'+String(lim.getHours()).padStart(2,'0')+':00';let fm=null;
    (j.hourly&&j.hourly.time||[]).forEach((t,i)=>{const v=j.hourly.temperature_2m?Number(j.hourly.temperature_2m[i]):NaN;if(t>cut&&t<=limS&&!isNaN(v)&&(!fm||v<fm.t))fm={t:Math.round(v*10)/10,at:t}});
    w.fmin=fm;
    let changed=0,best=null;
    w.days.forEach(x=>{if(x.mm<RAIN_MM)return;const p0=x.d.split('-'),D=dn(new Date(+p0[0],+p0[1]-1,+p0[2]).getTime());
      S.plants.forEach(p=>{if(p.ex||p.loc!=='garten'||!active(p))return;if(dn(p.last)>=D)return;
        const ts=D===today()?Date.now():new Date(+p0[0],+p0[1]-1,+p0[2],18).getTime();
        p.last=ts;p.snooze=0;p.moist=0;p.hist=(p.hist||[]).concat(ts).sort((a,b)=>a-b).slice(-30);changed++});
      if(!best||x.mm>best.mm)best={D:D,mm:x.mm}});
    if(changed){w.note={D:best.D,mm:best.mm,n:changed,at:today()};if(S.g.rainAuto!==best.D){S.g.rainAuto=best.D;S.g.st.rain++}}

  finally{wxBusy=false}
}

function fertDays(s){if(!s||NOFERT.has(s.id))return null;return FERTD[s.id]||({zimmer:14,kraut:21,gemuese:14,obst:30,blume:14})[s.c]||null}

const norm=s=>String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
function matches(text){
  const n=norm(text);if(!n)return{list:P.slice().sort(byPop),fuzzy:false};
  const exact=P.filter(p=>norm(p.n+' '+p.a).includes(n));
  if(exact.length||n.length<3)return{list:exact.sort(byPop),fuzzy:false};
  const tol=n.length>=6?2:1;
  return{list:P.filter(p=>norm(p.n+' '+p.a).split(' ').some(w=>w&&(lev(n,w)<=tol||(w.length>n.length&&lev(n,w.slice(0,n.length))<=tol)))).sort(byPop),fuzzy:true};
}

const dn=ts=>{const d=new Date(ts);return Math.round(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/DAY)};
const today=()=>dn(Date.now());
const month=()=>new Date().getMonth()+1;
const winter=()=>{const m=month();return m>=10||m<=3};

const fmtV=v=>v>=1000?String(Math.round(v/100)/10).replace('.',',')+' l':v+' ml';

/* Empfehlungen */
function rec(p){
  const s=SP[p.t];if(!s)return null;
  let b;
  if(p.pot==='beet')b=s.wb||s.ws;
  else if(p.loc==='drinnen'&&winter())b=s.ww||s.ws;
  else b=s.ws;
  if(p.pot!=='beet'){b*=({S:.8,M:1,L:1.25})[p.pot]||1;if(p.loc!=='drinnen'&&!winter())b*=.85}
  b*=homeFactor(p);
  return Math.max(1,Math.round(b));
}
function iv(p){return p.custom?Math.max(1,p.custom):Math.max(1,(rec(p)||4)+(p.adj||0))}
function why(p){
  const s=SP[p.t];if(!s)return['Eigene Pflanze: alle '+iv(p)+' Tage, so wie du es eingestellt hast.'];
  const o=[];
  if(p.pot==='beet')o.push(s.n+' im Beet: alle '+(s.wb||s.ws)+' Tage.');
  else{o.push(s.n+' im Sommer im mittleren Topf: alle '+s.ws+' Tage.');
    if(p.loc==='drinnen'&&winter()&&s.ww)o.push('Jetzt ist Winter, die Pflanze wächst langsamer: alle '+s.ww+' Tage.');
    if(p.pot==='S')o.push('Kleiner Topf: Die Erde trocknet schneller aus, darum etwas öfter.');
    if(p.pot==='L')o.push('Grosser Topf: Die Erde bleibt länger feucht, darum etwas seltener.');
    if(p.loc!=='drinnen'&&!winter())o.push('Draussen trocknet die Erde durch Sonne und Wind schneller aus.');}
  homeWhy(p).forEach(x=>o.push(x));
  if(p.custom)o.push('Du hast den Rhythmus selbst festgelegt: alle '+p.custom+' Tage.');
  else if(p.adj)o.push('Von dir gelernt («Noch feucht»): '+(p.adj>0?'+':'')+p.adj+' '+(Math.abs(p.adj)===1?'Tag':'Tage')+'.');
  return o;
}
function amt(p){
  const s=SP[p.t];const th=s?s.th:2;
  if(p.pot==='beet'){const g=(s&&s.g)||2;return 'ca. '+String(g).replace('.',',')+' l pro '+(s&&s.u==='m2'?'m²':'Pflanze')}
  let v=ML[p.pot||'M'][th-1];
  if(p.loc==='drinnen'&&winter()&&s&&s.ww)v=Math.max(50,Math.round(v*.75/50)*50);
  return 'ca. '+fmtV(v);
}
function phase(p){
  const s=SP[p.t];const m=month();
  if(!s)return'on';
  if(s.c==='zimmer')return(p.loc!=='drinnen'&&(m>=10||m<=4))?'cold':'on';
  if(p.loc==='drinnen'||!s.act)return'on';
  return s.act.includes(m)?'on':(s.ann?'pause':'rest');
}
const active=p=>{const ph=phase(p);return ph==='on'||ph==='cold'};
function dueIn(p){let d=dn(p.last)+iv(p);if(p.snooze&&p.snooze>d)d=p.snooze;return d-today()}
function nextMonth(s){const m=month();const a=(s&&s.act||[]).slice().sort((x,y)=>x-y);const n=a.find(x=>x>m)||a[0];return MON[(n||4)-1]}
function status(p){
  const ph=phase(p);
  if(ph==='pause')return['frost','Pause bis '+nextMonth(SP[p.t])];
  if(ph==='rest')return['frost','Winterruhe'];
  const d=dueIn(p);
  if(d<0)return['alert',d===-1?'Seit gestern':'Seit '+(-d)+' Tagen'];
  if(d===0)return['sun','Heute'];
  if(d===1)return['leaf','Morgen'];
  return['leaf','In '+d+' Tagen'];
}
function nextTxt(p){const d=dueIn(p);return d<=0?'heute':d===1?'morgen':dateLong(d)}
function where(p){return (p.room||LOC[p.loc])+' · '+(p.pot==='beet'?'im Beet':'Topf '+POT[p.pot].toLowerCase())}
const byId=id=>S.plants.find(p=>p.id===id);
const lastCheck=p=>p.checks&&p.checks.length?p.checks[p.checks.length-1]:null;
const openTodos=p=>(p.todos||[]).filter(t=>!t.done).length;
function fertNeedAt(p,D){const s=SP[p.t];const fd=fertDays(s);if(!fd||!active(p))return false;const m=dayDate(D-today()).getMonth()+1;if(m<3||m>9)return false;return D-dn(p.lastF||p.created)>=fd}
function fertNeed(p){return fertNeedAt(p,today())}
function fertDue(p){return fertNeed(p)&&active(p)&&dueIn(p)<=0}
function fertInfo(p){const s=SP[p.t];if(!s)return'';const fd=fertDays(s);if(!fd)return s.n+' braucht kaum Dünger.';const m=month();const base='Düngen: etwa alle '+fd+' Tage von März bis September, einfach ins Giesswasser. Die App sagt es dir am Giess-Tag.';if(m<3||m>9)return base+' Jetzt im Winter nicht düngen.';if(fertDue(p))return base+' Heute beim Giessen ist wieder Dünger dran.';if(fertNeed(p))return base+' Beim nächsten Giessen ist wieder Dünger dran.';return base+' Nächstes Mal in '+Math.max(1,fd-(today()-dn(p.lastF||p.created)))+' Tagen.'}

function potSvg(s,pot,md,cls,sk,stage){

const SPROUT={id:'_sprout'};

function mascot(){
  const own=S.plants.filter(p=>!p.ex);const list=own.length?own:S.plants;
  if(!S.plants.length)return{md:'happy',txt:'Hallo! Ich bin Sprössli. Füge deine erste Pflanze hinzu, dann passen wir zusammen auf sie auf.'};
  const act=list.filter(active);const due=act.filter(p=>dueIn(p)<=0).sort((a,b)=>dueIn(a)-dueIn(b));
  if(due.length){const w=due[0],d=-dueIn(w);
    if(d>=3)return{md:'wilt',txt:'Hilfe! '+w.name+' hat schon seit '+d+' Tagen Durst. Bitte schnell giessen.'};
    if(d>=1)return{md:'sad',txt:w.name+' wartet seit '+(d===1?'gestern':d+' Tagen')+' auf Wasser …'};
    return{md:'thirsty',txt:due.length===1?w.name+' hat heute Durst. Halt deine Serie am Leben!':due.length+' Pflanzen haben heute Durst. Los geht’s!'}}
  if(!act.length)return{md:'rest',txt:'Winterpause. Deine Pflanzen draussen ruhen sich aus.'};
  const nx=act.slice().sort((a,b)=>dueIn(a)-dueIn(b))[0],d=dueIn(nx);
  return{md:'happy',txt:'Alles grün! '+(d===1?'Morgen':'Am '+wdLong(d))+' hat '+nx.name+' wieder Durst.'};
}

const own=()=>S.plants.filter(p=>!p.ex);
function dueAtEnd(p,D){
  const ws=(p.hist||[]).filter(t=>dn(t)<=D);
  let w;if(ws.length)w=Math.max(...ws);else{const l0=p.l0!=null?p.l0:p.last;if(dn(l0)>D)return Infinity;w=l0}
  let due=dn(w)+iv(p);
  (p.ml||[]).forEach(m=>{if(dn(m.t)<=D&&m.t>=w)due=Math.max(due,m.u)});
  return due;
}
function evalStreak(){
  const g=S.g,t=today();
  if(g.lastEval==null)g.lastEval=t-1;
  if(t-1-g.lastEval>60){g.streak=0;g.lastEval=t-61}
  for(let D=g.lastEval+1;D<=t-1;D++){
    const rel=own().filter(p=>dn(p.created)<=D&&active(p));
    if(!rel.length)continue;
    if(rel.every(p=>dueAtEnd(p,D)>D))g.streak++;else g.streak=0;
    g.best=Math.max(g.best,g.streak);
  }
  g.lastEval=t-1;
}
function todayOk(){const a=own().filter(active);return a.length>0&&a.every(p=>dueIn(p)>0)}
function effStreak(){return S.g.streak+(todayOk()?1:0)}
function plantStreak(p){if(p.ex||!active(p)||dueIn(p)<0)return 0;return Math.max(0,today()-(p.since!=null?p.since:dn(p.created)))}

function addXP(n){if(!n)return;const b=level(S.g.xp).i;S.g.xp+=n;const a=level(S.g.xp).i;if(a>b){const r=rewardFor(a);celebrate('Level '+(a+1)+' erreicht: '+LVN[a]+'! Sprössli ist gewachsen.'+(r.length?' Neu: '+r.join(' und ')+'.':''))}}
function checkBadges(){
  const o=own(),st=S.g.st,eff=effStreak();S.g.best=Math.max(S.g.best,eff);
  const best=S.g.best;
  const cond={w1:st.w>=1,s100:best>=100,w100:st.w>=100,pr:o.some(p=>careStage(p)>=3),first:o.length>=1,s3:best>=3,s7:best>=7,s14:best>=14,s30:best>=30,p14:o.some(p=>plantStreak(p)>=14),w10:st.w>=10,w50:st.w>=50,m5:st.m>=5,f5:st.f>=5,doc:st.ph>=1,c5:o.length>=5,c10:o.length>=10,herb3:o.filter(p=>SP[p.t]&&SP[p.t].c==='kraut').length>=3,veg:o.some(p=>SP[p.t]&&(SP[p.t].c==='gemuese'||SP[p.t].c==='obst')),vac:st.vac>=1,rain:st.rain>=1};
  let ch=false;
  cond.all=BADGES.every(b=>b[0]==='all'||S.g.badges[b[0]]||cond[b[0]]);
  BADGES.forEach(b=>{if(cond[b[0]]&&!S.g.badges[b[0]]){S.g.badges[b[0]]=Date.now();celebrate('Neues Abzeichen: '+b[1]+' · +50 Punkte');addXP(50);ch=true}});
  o.forEach(p=>{const c=careStage(p);if(c>(p.cs||0)){if(c>=2)celebrate(p.name+' ist jetzt «'+CARE[c]+'» und ist gewachsen!');p.cs=c;ch=true}});
  const tp=o.find(p=>plantStreak(p)>=14&&!p.b14);if(tp){tp.b14=1;ch=true;celebrate('Zwei Wochen pünktlich: '+tp.name+'!')}
  if(ch)save();
}
function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('div');c.className='confetti';c.setAttribute('aria-hidden','true');
  const cols=['#F2B33D','#4FA04A','#2B78D0','#E8711A','#E87AA4','#8E5BC4'];
  for(let i=0;i<34;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[i%cols.length];e.style.animationDelay=(Math.random()*.4)+'s';e.style.animationDuration=(1.2+Math.random()*.8)+'s';c.appendChild(e)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2600);
}

let schedT=null,notifMsg='';

function atTime(k,hm){const p=String(hm||'08:00').split(':');const x=dayDate(k);x.setHours(+p[0]||0,+p[1]||0,0,0);return x}
function dueDays(p,from,to){const out=[];if(!active(p))return out;const step=iv(p);let d=today()+dueIn(p);if(d<from)d=from;for(;d<=to&&out.length<60;d+=step)out.push(d);return out}
function buildNotifs(){
  /* Pro Tag eine gesammelte Mitteilung am Morgen, falls gewünscht eine am Abend.
     Wer nicht giesst, wird an den zwei Tagen danach nochmal erinnert. Beim Giessen wird alles neu geplant. */
  const t=today(),now=Date.now(),map={},eff=effStreak();
  const add=(D,p,lt)=>{if(D<t||D>t+13)return;const a=(map[D]=map[D]||[]);if(!a.some(x=>x.p===p))a.push({p:p,lt:lt})};
  own().forEach(p=>{if(!active(p))return;const di=dueIn(p),d0=t+Math.max(0,di),l0=Math.max(0,-di);
    for(let i=0;i<3;i++)add(d0+i,p,l0+i);
    dueDays(p,t,t+13).forEach(D=>add(D,p,0))});
  const out=[];
  Object.keys(map).map(Number).sort((a,b)=>a-b).forEach(D=>{
    const ps=map[D],k=D-t,names=ps.map(x=>x.p.name),one=ps.length===1?ps[0]:null;
    const title=one?(one.lt>0?one.p.name+(one.lt===1?' wartet seit gestern':' wartet seit '+one.lt+' Tagen'):one.p.name+' hat Durst'):ps.length+' Pflanzen haben Durst';
    let body=one?(one.lt>0?'Bitte heute giessen, sonst wird sie traurig. Giess '+amt(one.p)+'.':'Giess '+amt(one.p)+'. Vorher kurz die Fingerprobe machen.'):listJoin(names)+' warten auf Wasser.';
    const fdD=ps.filter(x=>fertNeedAt(x.p,D)).map(x=>x.p.name);if(fdD.length)body+=' Ins Giesswasser auch Dünger: '+listJoin(fdD)+'.';
    const m=atTime(k,S.set.mt);if(m.getTime()>now+30000)out.push({id:1000+k*2,title:title,body:body,schedule:{at:m,allowWhileIdle:true}});
    if(S.set.eve){const e=atTime(k,S.set.et);if(e.getTime()>now+30000&&e>m)out.push({id:1001+k*2,title:'Noch nicht gegossen?',body:(k===0&&eff>0?'Deine Serie von '+eff+' '+(eff===1?'Tag':'Tagen')+' wartet. ':'')+listJoin(names)+' '+(ps.length===1?'hat':'haben')+' noch Durst.',schedule:{at:e,allowWhileIdle:true}})}
  });
  const fw=typeof frostWarn==='function'?frostWarn():null;
  if(fw){const e=atTime(0,'17:00');if(e.getTime()>now+30000)out.push({id:990,title:'Frost '+frostWhen(fw.at)+': '+String(fw.t).replace('.',',')+' °C',body:'Hol deine empfindlichen Pflanzen rein: '+listJoin(fw.ps.map(p=>p.name))+'.',schedule:{at:e,allowWhileIdle:true}})}
  return out.slice(0,60);
}
async function scheduleNotifs(){
  if(!nat())return;
  try{
    const pend=await callN('LocalNotifications','getPending',{});
    const ids=((pend&&pend.notifications)||[]).map(n=>({id:n.id}));
    if(ids.length)await callN('LocalNotifications','cancel',{notifications:ids});
    if(!S.set.notif)return;
    const list=buildNotifs();if(list.length)await callN('LocalNotifications','schedule',{notifications:list});
  }catch(e){}
}
async function enableNotif(){
  if(!nat()){toast('Erinnerungen gibt es in der iPhone-App.');return}
  S.set.asked=true;
  try{
    let r=await callN('LocalNotifications','checkPermissions',{});
    if(!r||r.display!=='granted')r=await callN('LocalNotifications','requestPermissions',{});
    if(r&&r.display==='granted'){S.set.notif=true;notifMsg='';save();render();toast('Erinnerungen sind an. Ich melde mich um '+S.set.mt+' Uhr.')}
    else{notifMsg='Mitteilungen sind nicht erlaubt. Du kannst sie in den iPhone-Einstellungen bei Topfkumpel einschalten.';save();render()}
  }catch(e){notifMsg='Das Erinnerungs-Modul fehlt noch. Führ im Terminal «npm install @capacitor/local-notifications@8» und danach «npx cap sync ios» aus.';save();render()}
}

const SPEC_FIELDS='n: gebräuchlicher deutscher Name (Schweizer Schreibweise, ss statt ß); e: ein passendes Emoji; c: "zimmer", "kraut", "gemuese", "obst" oder "blume" (Blumen, Sträucher, Kübelpflanzen draussen); l: typischer Standort "drinnen", "balkon" oder "garten"; d: Schwierigkeit 1 bis 3; ws: Tage zwischen dem Giessen im Sommer im mittelgrossen Topf (1 bis 60); ww: Tage zwischen dem Giessen im Winter in der Wohnung (1 bis 90) oder null; wb: Tage zwischen dem Giessen im Gartenbeet (1 bis 60) oder null bei Zimmerpflanzen; th: Wasserbedarf 1 wenig, 2 mittel, 3 viel; g: Liter pro Giessen im Beet; u: "Pflanze" oder "m2"; tox: true wenn giftig für Katzen oder Hunde; ann: true wenn draussen einjährig; act: Monate 1 bis 12, in denen sie draussen gegossen werden muss ([] bei Zimmerpflanzen); cal: bei Nutzpflanzen {"s":[Aussaat-Monate],"p":[Pflanz-Monate],"h":[Ernte-Monate]}, sonst null; m: besondere Giessmethode als kurzer Satz oder null; w: Liste mit besonderen Wasser-Hinweisen aus "kalkarm", "regen" (nur Regenwasser), "warm" (zimmerwarm), "unten" (von unten giessen), "blatt" (nicht über die Blätter), sonst []; t: 3 bis 4 Paare [Titel, Text] mit Titeln aus "Standort", "Giessen", "Pflege", "Pflanzen", "Ernte", "Winter", "Tipp" und je 1 bis 2 kurzen, konkreten Sätzen.';

function refreshSugg(){const el=$('#sugg');if(el)el.innerHTML=suggHtml()}
function aiPrompt(name){return 'Du bist Gartenexperte für die Schweiz und Deutschland (Klima Mittelland). Jemand hat in einer Pflanzen-App diese Pflanze eingegeben: «'+name+'».\nErkenne die Pflanze, auch bei Tippfehlern, Dialekt- oder Handelsnamen. Ist es keine echte Pflanze oder erkennst du sie nicht sicher, antworte nur mit {"unbekannt":true}.\nSonst antworte nur mit einem JSON-Objekt mit diesen Feldern: '+SPEC_FIELDS}
function normSp(o,fallback){
  const int=(v,a,b)=>{v=Math.round(Number(v));return v>=a&&v<=b?v:null};
  const months=v=>Array.isArray(v)?v.map(Number).filter(x=>x>=1&&x<=12&&Math.round(x)===x):[];
  const c=CATS.includes(o.c)?o.c:'zimmer';
  const l=['drinnen','balkon','garten'].includes(o.l)?o.l:(c==='zimmer'?'drinnen':'garten');
  const n=(typeof o.n==='string'&&o.n.trim()?o.n.trim():fallback).slice(0,40);
  const s={id:'ai-'+norm(n).replace(/ /g,'-').slice(0,30)+'-'+Date.now().toString(36),n:n,a:norm(fallback),e:(typeof o.e==='string'&&o.e.length<=8&&o.e.trim())?o.e.trim():'🪴',c:c,l:l,d:int(o.d,1,3)||2,ws:int(o.ws,1,60)||5,th:int(o.th,1,3)||2,tox:o.tox?1:0,ai:1};
  const ww=int(o.ww,1,90);if(ww)s.ww=ww;
  const wb=int(o.wb,1,60);if(wb&&c!=='zimmer')s.wb=wb;
  const g=Number(o.g);s.g=g>0&&g<=50?Math.round(g*2)/2:2;
  if(o.u==='m2')s.u='m2';
  if(c!=='zimmer'){const a=months(o.act);s.act=a.length?a:R(4,10);if(o.ann)s.ann=1}
  if(o.cal&&typeof o.cal==='object'){const cl={};['s','p','h'].forEach(k=>{const m=months(o.cal[k]);if(m.length)cl[k]=m});if(Object.keys(cl).length)s.cal=cl}
  if(typeof o.m==='string'&&o.m.trim())s.m=o.m.trim().slice(0,200);
  if(Array.isArray(o.w))s.w=o.w.filter(k=>['kalkarm','regen','warm','unten','blatt'].includes(k));
  s.t=(Array.isArray(o.t)?o.t:[]).filter(x=>Array.isArray(x)&&typeof x[0]==='string'&&typeof x[1]==='string').slice(0,5).map(x=>[x[0].slice(0,24),x[1].slice(0,300)]);
  if(!s.t.length)s.t=[['Giessen','Vor dem Giessen die Fingerprobe machen: Ist die Erde 2 cm tief trocken, giessen.']];
  return s;
}
function normHealth(z){
  if(!z||typeof z!=='object')return null;
  const st=['gut','mittel','schlecht'].includes(z.status)?z.status:'mittel';
  const sc=Math.max(1,Math.min(10,Math.round(Number(z.score))||(st==='gut'?8:st==='mittel'?5:2)));
  const arr=(a,n)=>(Array.isArray(a)?a:[]).filter(x=>typeof x==='string'&&x.trim()).slice(0,n).map(x=>x.trim().slice(0,200));
  return{status:st,score:sc,befund:typeof z.befund==='string'?z.befund.slice(0,240):'',zeichen:arr(z.zeichen,3),schritte:arr(z.schritte,3),giessen:['zu_viel','zu_wenig','passt'].includes(z.giessen)?z.giessen:'unklar'};
}
function aiErr(code){
  if(code==='cancelled')return'';
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){sampleFn=null;imgOK=false;return'Claude ist hier nicht erlaubt oder nicht verfügbar.'}
  if(code==='images_unavailable'){imgOK=false;return'Fotos können hier nicht an Claude geschickt werden.'}
  if(code==='image_rejected')return'Dieses Bild geht nicht. Nimm ein normales Foto (JPEG oder PNG).';
  if(code==='rate_limited')return'Gerade zu viele Anfragen. Versuch es in ein paar Minuten nochmal.';
  if(code==='session_expired')return'Du bist nicht mehr angemeldet. Melde dich bei Claude neu an.';
  if(code==='refused')return'Dazu gibt es keine Antwort.';
  return'Das hat nicht geklappt. Versuch es nochmal.';
}
function speciesFrom(o,name){

  const dup=P.find(p=>norm(p.n)===norm(o.name||name||''));if(dup)return dup;
  if(o.art&&typeof o.art==='object'){const s=normSp(o.art,o.name||name||'Pflanze');const d2=P.find(p=>norm(p.n)===norm(s.n));if(d2)return d2;addSpecies(s);S.lib=(S.lib||[]).concat(s);save();return s}
  return null;
}
async function research(){
  const name=(cfg.name||'').trim();
  if(name.length<2){aiMsg='Gib zuerst den Namen der Pflanze ein.';refreshSugg();return}
  if(aiBusy)return;
  if(!sampleFn){aiMsg='Die automatische Suche ist hier nicht verfügbar. Trag den Rhythmus unten selbst ein.';refreshSugg();return}
  const known=P.find(p=>norm(p.n)===norm(name));
  if(known){pick(known.id);toast(known.n+' ist schon im Lexikon.');return}
  aiBusy=true;aiMsg='';refreshSugg();aiCtl=new AbortController();
  try{
    const o=await sampleFn.json(aiPrompt(name),{signal:aiCtl.signal});
    aiBusy=false;aiCtl=null;
    if(!o||typeof o!=='object'||o.unbekannt)aiMsg='Claude konnte «'+name+'» keiner Pflanze sicher zuordnen. Prüfe die Schreibweise oder trag den Rhythmus unten selbst ein.';
    else{const s=speciesFrom({art:o,name:o.n},name);if(s){pick(s.id);toast('Pflege-Infos für '+s.n+' gefunden.');return}}
  }catch(e){aiBusy=false;aiCtl=null;aiMsg=aiErr(e&&e.code)}
  if(V.v==='config')refreshSugg();
}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res({img:i,url:u});i.onerror=()=>rej(new Error('img'));i.src=u})}
async function prep(file){
  const r=await loadImg(file),img=r.img;
  const w=img.naturalWidth,hh=img.naturalHeight,f=Math.min(1,1280/Math.max(w,hh));
  const c=document.createElement('canvas');c.width=Math.round(w*f);c.height=Math.round(hh*f);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(rs=>c.toBlob(rs,'image/jpeg',.85));
  const t=document.createElement('canvas');t.width=t.height=200;const s=Math.min(w,hh);t.getContext('2d').drawImage(img,(w-s)/2,(hh-s)/2,s,s,0,0,200,200);
  return{blob:blob,thumb:t.toDataURL('image/jpeg',.7),url:r.url};
}

function checkPrompt(p){

async function onPhoto(file){
  if(!file||!camMode)return;
  const mode=camMode.mode,id=camMode.id;let img;

  aiCtl=new AbortController();

      if(V.v!=='scan')return;

      const s=speciesFrom(o,o.name);
      if(!s){V.err='Die Pflanze konnte nicht bestimmt werden. Versuch ein anderes Foto oder such sie in der Liste.';return render()}
      const loc=['drinnen','balkon','garten'].includes(o.standort)?o.standort:s.l;
      const fl=locsFor(s).includes(loc)?loc:s.l;
      let pot=['S','M','L','beet'].includes(o.topf)?o.topf:(fl==='garten'?'beet':'M');
      if(!potsFor(s,fl).includes(pot))pot=fl==='garten'?'beet':'M';
      aiMsg='';
      cfg={t:s.id,name:'',loc:fl,pot:pot,room:fl==='drinnen'?(s.c==='kraut'?'Küche':'Wohnzimmer'):'',ago:o.erde==='trocken'?-1:0,custom:null,err:'',back:{v:'add'},photo:{thumb:img.thumb,sicher:Math.max(0,Math.min(100,Math.round(Number(o.sicher))||0)),alts:(Array.isArray(o.alternativen)?o.alternativen:[]).filter(x=>typeof x==='string').slice(0,2),z:normHealth(o.zustand),erde:o.erde}};
      go({v:'config'});
    }else{
      const p=byId(id);if(!p)return go({v:'home'});
      const o=await sampleFn.json(checkPrompt(p),{images:[img.blob],signal:aiCtl.signal});
      if(V.v!=='scan')return;
      if(!o||o.pflanze===false){V.err='Auf dem Foto ist keine Pflanze zu erkennen. Versuch es nochmal näher und bei Tageslicht.';return render()}
      const z=normHealth(o.zustand);if(!z){V.err='Die Auswertung hat nicht geklappt. Versuch es nochmal.';return render()}
      const r=Math.round(Number(o.rhythmus));
      p.checks=(p.checks||[]).concat({ts:Date.now(),thumb:img.thumb,status:z.status,score:z.score,befund:z.befund}).slice(-8);
      z.schritte.forEach(t=>p.todos.push({t:t,done:false}));p.todos=p.todos.slice(-8);
      if(!p.ex&&(!p.xph||Date.now()-p.xph>=7*DAY)){p.xph=Date.now();S.g.st.ph++;addXP(15)}
      if(!save()){p.checks=p.checks.slice(-3);save()}
      checkBadges();
      go({v:'checkres',id:p.id,res:{z:z,passt:o.passt!==false,rhythm:r>=1&&r<=90&&r!==iv(p)?r:null,thumb:img.thumb}});
      flushCeleb();
    }
  }catch(e){if(V.v!=='scan')return;const m=aiErr(e&&e.code);if(!m)return go(mode==='new'?{v:'add'}:{v:'detail',id:id});V.err=m;render()}
  finally{aiCtl=null}
}

  const a=cfg.ago>=0?cfg.ago:iv(p);p.last=Date.now()-a*DAY;p.l0=p.last;p.hist=cfg.ago>=0?[p.last]:[];p.since=today();

}

  else if(a==='help'){helpFrom=V;go({v:'help',pid:d.id||null})}
  else if(a==='helpback'){go(helpFrom&&helpFrom.v!=='help'?helpFrom:{v:V.pid?'detail':'lex',id:V.pid})}
  else if(a==='helpup'){V={v:'help',pid:V.pid};render();window.scrollTo(0,0)}
  else if(a==='pestplan'&&p){const pr=PROBS.find(x=>x.id==='tiere'),c=pr&&pr.c[+d.pest];if(c){c[4].forEach(t=>p.todos.push({t:c[0]+': '+t,done:false}));p.todos=p.todos.slice(-12);save();toast(c[4].length+' Aufgaben bei '+p.name+' gespeichert.');render()}}
  else if(a==='hdry'||a==='hhot'){S.set.home=homeSet();const k=a==='hdry'?'dry':'hot';S.set.home[k]=!S.set.home[k];save();render()}
  else if(a==='bkmake')doBackup();
  else if(a==='bkload')doRestore();
  else if(a==='wxtoggle'){S.set.wx=Object.assign({on:false,name:'',lat:null,lon:null},S.set.wx||{});S.set.wx.on=!S.set.wx.on;wxMsg='';wxPlaces=null;save();render();if(S.set.wx.on)wxCheck(true)}
  else if(a==='wxchange'){wxPlaces=[];wxMsg='';render()}
  else if(a==='wxsearch'){const i=$('#wxQ');if(i&&i.value.trim())wxSearch(i.value.trim())}
  else if(a==='vpre'){vacPre=!vacPre;render()}
  else if(a==='vshare'||a==='vcopy'){const txt=vacText();const done=()=>{if(!S.g.st.vac){S.g.st.vac=1;save();checkBadges();flushCeleb(600)}};
    if(a==='vshare'&&navigator.share){navigator.share({title:'Giessplan',text:txt}).then(done).catch(()=>{})}
    else{const fb=()=>{const el=$('#vtext');if(el){const dt=el.closest('details');if(dt)dt.open=true;el.focus();el.select()}toast('Text markiert. Jetzt kopieren und verschicken.');done()};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>{toast('Ferienplan kopiert.');done()}).catch(fb);else fb()}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='vName'){S.set.vacName=t.value.slice(0,30);updVac()}
  if(t.id==='cfgName'){cfg.name=t.value;cfg.err='';if(!SP[cfg.t]){const ti=$('#cfgTitle');if(ti)ti.textContent=t.value.trim()||'Neue Pflanze';aiMsg='';refreshSugg()}}
  if(t.id==='cfgCustom'){const v=parseInt(t.value,10);cfg.custom=v>=1?Math.min(90,v):null}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cfgCustom'&&V.v==='config')render();
  if(t.id==='mt'&&t.value){S.set.mt=t.value;save()}
  if(t.id==='et'&&t.value){S.set.et=t.value;save()}
  if(t.id==='vf'||t.id==='vt'){const f=parseDay($('#vf').value),to=parseDay($('#vt').value);if(f!=null)vacFrom=Math.max(today(),f);if(to!=null)vacTo=to;if(vacTo<vacFrom)vacTo=vacFrom;render()}
  if(t.id==='vName'){S.set.vacName=t.value.slice(0,30);save();if(V.v==='vac')render()}
  const p=V.v==='detail'?byId(V.id):null;
  if(!p)return;
  if(t.id==='dName'||t.id==='dCustom')detOpen=true;
  if(t.id==='dName'){const v=t.value.trim();if(v){p.name=v;save();render()}}
  if(t.id==='dCustom'){const v=parseInt(t.value,10);p.custom=v>=1?Math.min(90,v):null;p.adj=0;p.moist=0;save();render();toast(p.custom?'Eigener Rhythmus: alle '+p.custom+' Tage.':'Empfehlung wieder aktiv.')}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wxCheck();evalStreak();checkBadges();if(['home','awards'].includes(V.v))render();scheduleSoon();flushCeleb(800)}});
load();(S.lib||[]).forEach(addSpecies);evalStreak();checkBadges();celebQ=[];save();render();
if(!S.set.tour)setTimeout(S.set.q?startTour:startQuestions,300);
setTimeout(()=>wxCheck(),1200);
document.addEventListener('keydown',e=>{if(tourI>=0&&e.key==='Escape')endTour();if(e.key==='Enter'&&e.target&&e.target.id==='wxQ'&&e.target.value.trim()){e.preventDefault();wxSearch(e.target.value.trim())}});
(async()=>{
  try{sampleFn=window.claude&&typeof window.claude.use==='function'?await window.claude.use('sample'):null}catch(e){sampleFn=null}
  if(sampleFn){try{const l=await sampleFn.limits();imgOK=!!(l&&l.images)}catch(e){imgOK=false}}
  if(V.v==='add'||V.v==='lex'){app.innerHTML=listView(V.v);results(V.v);const i=$('#q');if(i)i.addEventListener('input',()=>{q=i.value;results(V.v)})}
  else if(V.v==='config')refreshSugg();
  else if(V.v==='detail')render();
})();
})();
</script>

</body>
</html>
